<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Simon | Brick Breaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body class="dark-mode">
    <script>
        // Match the theme chosen on the main page
        try { if (localStorage.getItem('darkMode') === 'false') document.body.classList.remove('dark-mode'); } catch (e) {}
    </script>

    <nav class="navbar" aria-label="Main">
        <a class="nav-brand" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Andrew Simon</a>
    </nav>

    <main id="main">
        <!-- Brick Breaker -->
        <section id="game" class="section">
            <div class="section-head">
                <h1 class="section-title">Brick Breaker</h1>
                <p class="section-lede">You found it! Use the left and right arrow keys to move the paddle.</p>
            </div>
            <div class="game-container">
                <canvas id="gameCanvas" width="800" height="500" role="img" aria-label="Brick Breaker game board"></canvas>
                <div class="game-controls">
                    <button id="startGame" class="game-btn" type="button">Start Game</button>
                    <button id="pauseGame" class="game-btn" type="button">Pause Game</button>
                    <button id="resetGame" class="game-btn" type="button">Reset Game</button>
                    <div class="score-display" aria-live="polite">
                        <p>Score: <span id="score">0</span></p>
                        <p>Lives: <span id="lives">3</span></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; <span id="year">2026</span> Andrew Simon. All rights reserved.</p>
        <div class="social-links">
            <a href="https://github.com/CheeseyDanish" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>
            <a href="https://www.linkedin.com/in/andrew-simon-492390265" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin" aria-hidden="true"></i></a>
        </div>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    <script src="js/game.js"></script>
</body>
</html>
